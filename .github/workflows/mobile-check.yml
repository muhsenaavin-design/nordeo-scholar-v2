name: Mobile layout check
# Design specification: every page displays correctly at 375 px. Runs on every pull request.
on:
  pull_request:
  workflow_dispatch:
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_ADMIN_PATH: admin
      - run: npm run check:mobile
