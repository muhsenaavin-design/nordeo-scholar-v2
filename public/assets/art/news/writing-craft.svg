    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1"><stop offset=".35" stop-color="#f3ede0" stop-opacity="0"/><stop offset="1" stop-color="#f3ede0" stop-opacity=".9"/></linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
